name: Release

# Builds Linux (.deb via Docker), Windows (MSI), macOS (.app/.dmg), and
# Android (signed release APK) on every push of a version tag, then
# attaches all four artifacts to a GitHub Release. iOS is intentionally
# excluded: it needs a paid Apple Developer account, App Store/TestFlight
# review, and ongoing maintenance that aren't set up.
#
# Linux uses the "system" format (not AppImage): Briefcase's own AppImage
# support warns it's best-effort/unreliable, and it hit a genuine bug
# ('collections.OrderedDict object' has no attribute 'host_arch') when
# tried here. "system" builds a real .deb inside a Docker container
# matching --target, which is also what the Briefcase docs recommend.
#
# Android is properly signed (see ANDROID_KEYSTORE_* secrets, generated by
# generate-android-keystore.yml) so it installs cleanly via sideloading.
# macOS is signed with a real Developer ID identity and notarized via an
# App Store Connect API key (see MACOS_*/APPLE_TEAM_ID secrets -- set these
# up by running the commands printed in the project's setup instructions on
# a Mac with the cert already in Keychain Access; nothing sensitive needs to
# pass through anywhere but `gh secret set`). Windows is still --adhoc-sign,
# pending a SignPath.io application (free for OSS, but requires approval).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            format: system
            build-args: --target ubuntu:noble
            package-args: --target ubuntu:noble -p deb
          - os: windows-latest
            platform: windows
            format: app
            build-args: ""
            package-args: --adhoc-sign
          - os: macos-latest
            platform: macOS
            format: app
            build-args: ""
            package-args: ""
          - os: ubuntu-latest
            platform: android
            format: gradle
            build-args: ""
            package-args: -p apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build
        run: briefcase build ${{ matrix.platform }} ${{ matrix.format }} --no-input ${{ matrix.build-args }}

      # macOS: import the Developer ID cert into a throwaway keychain (its
      # password just needs to exist for this job, nothing persists after),
      # store App Store Connect API-key notarization credentials under the
      # exact profile name Briefcase looks for (briefcase-macOS-<team-id>,
      # see SigningIdentity.profile in briefcase's own source), and discover
      # the signing identity string rather than hardcoding it.
      - name: Import macOS signing certificate
        if: matrix.platform == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_API_KEY_BASE64: ${{ secrets.MACOS_API_KEY_BASE64 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm cert.p12

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Found signing identity: $IDENTITY"
          echo "MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          echo "$MACOS_API_KEY_BASE64" | base64 -d > AuthKey.p8
          xcrun notarytool store-credentials "briefcase-macOS-$APPLE_TEAM_ID" \
            --key AuthKey.p8 --key-id "$MACOS_API_KEY_ID" --issuer "$MACOS_API_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm AuthKey.p8

      - name: Package
        if: matrix.platform != 'macOS'
        run: briefcase package ${{ matrix.platform }} ${{ matrix.format }} --no-input ${{ matrix.package-args }}

      - name: Package (macOS, signed + notarized)
        if: matrix.platform == 'macOS'
        run: briefcase package macOS app --no-input -i "$MACOS_IDENTITY"

      # `briefcase package android gradle -p apk` produces an unsigned release
      # APK -- Briefcase has no Android signing support of its own (--adhoc-sign
      # is explicitly a no-op for this platform), so sign it by hand with the
      # Android SDK tools Briefcase already downloaded into its tool cache.
      - name: Sign Android APK
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

          SEARCH_ROOTS="$HOME/.cache/briefcase $HOME/.android /usr/local/lib/android ${ANDROID_HOME:-} ${ANDROID_SDK_ROOT:-} /"
          ZIPALIGN=$(find $SEARCH_ROOTS -iname "zipalign" -type f 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(find $SEARCH_ROOTS -iname "apksigner" -type f 2>/dev/null | sort -V | tail -1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          UNSIGNED_APK=$(find dist -iname "*.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED_APK"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" dist/aligned.apk
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out dist/signed.apk \
            dist/aligned.apk

          rm "$UNSIGNED_APK" dist/aligned.apk release.keystore
          mv dist/signed.apk "${UNSIGNED_APK%.apk}-signed.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
