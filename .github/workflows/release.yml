name: Release

# Builds Linux (.deb via Docker), Windows (MSI), macOS (.app/.dmg), and
# Android (signed release APK) on every push of a version tag, then
# attaches all four artifacts to a GitHub Release. iOS is intentionally
# excluded: it needs a paid Apple Developer account, App Store/TestFlight
# review, and ongoing maintenance that aren't set up.
#
# Linux uses the "system" format (not AppImage): Briefcase's own AppImage
# support warns it's best-effort/unreliable, and it hit a genuine bug
# ('collections.OrderedDict object' has no attribute 'host_arch') when
# tried here. "system" builds a real .deb inside a Docker container
# matching --target, which is also what the Briefcase docs recommend.
#
# Android is properly signed (see ANDROID_KEYSTORE_* secrets, generated by
# generate-android-keystore.yml) so it installs cleanly via sideloading.
# Windows and macOS are still --adhoc-sign for now: Windows signing is
# pending a SignPath.io application (free for OSS, but requires approval),
# and macOS needs the Developer ID cert + notarization credentials wired
# in as secrets -- both are tracked as follow-up work, not done here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            format: system
            build-args: --target ubuntu:noble
            package-args: --target ubuntu:noble -p deb
          - os: windows-latest
            platform: windows
            format: app
            build-args: ""
            package-args: --adhoc-sign
          - os: macos-latest
            platform: macOS
            format: app
            build-args: ""
            package-args: --adhoc-sign
          - os: ubuntu-latest
            platform: android
            format: gradle
            build-args: ""
            package-args: -p apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Briefcase
        run: python -m pip install briefcase

      - name: Build
        run: briefcase build ${{ matrix.platform }} ${{ matrix.format }} --no-input ${{ matrix.build-args }}

      - name: Package
        run: briefcase package ${{ matrix.platform }} ${{ matrix.format }} --no-input ${{ matrix.package-args }}

      # `briefcase package android gradle -p apk` produces an unsigned release
      # APK -- Briefcase has no Android signing support of its own (--adhoc-sign
      # is explicitly a no-op for this platform), so sign it by hand with the
      # Android SDK tools Briefcase already downloaded into its tool cache.
      - name: Sign Android APK
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

          SEARCH_ROOTS="$HOME/.cache/briefcase $HOME/.android /usr/local/lib/android ${ANDROID_HOME:-} ${ANDROID_SDK_ROOT:-} /"
          ZIPALIGN=$(find $SEARCH_ROOTS -iname "zipalign" -type f 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(find $SEARCH_ROOTS -iname "apksigner" -type f 2>/dev/null | sort -V | tail -1)
          echo "Using zipalign: $ZIPALIGN"
          echo "Using apksigner: $APKSIGNER"

          UNSIGNED_APK=$(find dist -iname "*.apk" | head -1)
          echo "Unsigned APK: $UNSIGNED_APK"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" dist/aligned.apk
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out dist/signed.apk \
            dist/aligned.apk

          rm "$UNSIGNED_APK" dist/aligned.apk release.keystore
          mv dist/signed.apk "${UNSIGNED_APK%.apk}-signed.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
