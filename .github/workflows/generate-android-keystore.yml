name: Generate Android keystore (manual utility)

# One-off utility, not part of the normal release pipeline: generates a new
# release signing keystore and uploads it (plus its passwords) as a build
# artifact so it can be retrieved once and stored as repo secrets. Rerunning
# this would produce a NEW key -- don't, unless deliberately rotating, since
# every future release must be signed with the SAME key as previous ones.

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          # PKCS12 (keytool's modern default keystore type) doesn't support a
          # per-entry key password different from the store password -- using
          # two different values here silently breaks later signing.
          PASS=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore -storetype PKCS12 \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Peptide Dosage, OU=Development, O=Peptide Dosage, C=US"
          {
            echo "alias=upload"
            echo "storepass=$PASS"
            echo "keypass=$PASS"
          } > credentials.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            release.keystore
            credentials.txt
          retention-days: 1
