[tool.briefcase]
project_name = "peptide-dosage"
bundle = "org.example"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
url = "https://example.org/peptide-dosage"
author = "Adam"
author_email = "agjennings@gmail.com"

[tool.briefcase.app.peptide_dosage]
formal_name = "Peptide Dosage"
description = "Peptide reconstitution dosing, titration schedules, and adherence tracking."
long_description = """
Peptide Dosage is a cross-platform GUI for calculating peptide
reconstitution dilutions, U-100 insulin syringe draws, titration
schedules, multi-person patient protocol tracking, and PubMed literature
citations. Research/educational tool -- not medical advice.
"""
sources = ["src/peptide_dosage"]
requires = []

[tool.briefcase.app.peptide_dosage.macOS]
requires = ["toga-cocoa~=0.5.0"]

[tool.briefcase.app.peptide_dosage.windows]
requires = ["toga-winforms~=0.5.0"]

[tool.briefcase.app.peptide_dosage.linux]
requires = ["toga-gtk~=0.5.0"]

[tool.briefcase.app.peptide_dosage.linux.system]
# Ubuntu 24.04+ ships GObject-Introspection 2.0 (libgirepository-2.0-dev);
# older releases (22.04 and earlier) need libgirepository1.0-dev instead --
# our CI only targets ubuntu:noble (24.04) so this list isn't distro-generic.
system_requires = [
    "pkg-config",
    "python3-dev",
    "libgirepository-2.0-dev",
    "libcairo2-dev",
    "gir1.2-gtk-3.0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.peptide_dosage.iOS]
requires = ["toga-iOS~=0.5.0"]

[tool.briefcase.app.peptide_dosage.android]
requires = ["toga-android~=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
